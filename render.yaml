services:
  - type: web
    name: pixelmapper
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_PATH
        value: /data/pixelmapper.db
      - key: FRONTEND_DIST
        value: /app/frontend/dist
    disk:
      name: pixelmapper-data
      mountPath: /data
      sizeGB: 1
